server:
    port: 8085

spring:
    application:
        name: course-access-service

    config:
        import: optional:configserver:http://localhost:8888

    datasource:
        url: jdbc:mysql://localhost:3306/course_access_db?createDatabaseIfNotExist=true
        username: root
        password: shubhs#R83

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

    instance:
        prefer-ip-address: true

# Resilience4j fallback configuration
resilience4j:
    circuitbreaker:
        instances:
            paymentService:
                sliding-window-size: 5
                failure-rate-threshold: 50
                wait-duration-in-open-state: 10s
                permitted-number-of-calls-in-half-open-state: 3

feign:
  circuitbreaker:
    enabled: true