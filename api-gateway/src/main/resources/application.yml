server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: registration-login-service
              uri: lb://REGISTRATION-LOGIN-SERVICE
              predicates:
                - Path=/registration-login-service/**
              filters:
                - StripPrefix=1

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment-service/**
              filters:
                - StripPrefix=1

            - id: course-creation-service
              uri: lb://COURSE-CREATION-SERVICE
              predicates:
                - Path=/course-creation-service/**
              filters:
                - StripPrefix=1

            - id: course-access-service
              uri: lb://COURSE-ACCESS-SERVICE
              predicates:
                - Path=/course-access-service/**
              filters:
                - StripPrefix=1

            - id: admin-service
              uri: lb://ADMIN-SERVICE
              predicates:
                - Path=/admin-service/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoint:
    gateway:
      enabled: true

  endpoints:
    web:
      exposure:
        include: gateway,health

jwt:
  secret: mySuperSecretKeyForJwtSigning1234567890